<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- OGP・メタ情報
       - theme-color は CSS 変数と2箇所で管理。変更時は両方合わせること
       - og:image は public/ogp.png（1200×630px 推奨）。**画像を差し替えたらクエリ ?v=N の N を上げる**
         ＝SNS のクローラは URL 単位で画像をキャッシュするので、URL が同じままだと旧画像が配られ続ける
       - og:description は設定しない
       - 本文・タイトルの各シェル（public/contents/*.html）にも同じ OGP 設定を揃える
  -->
  <meta name="theme-color" content="#080808" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:title" content="輝くもの《リルメナ》" />
  <meta property="og:url" content="https://haguchikarasu.github.io/lirmena/" />
  <meta property="og:image" content="https://haguchikarasu.github.io/lirmena/ogp.png?v=3" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>輝くもの《リルメナ》</title>
  <!-- 目次の favicon は stage に応じて index.ts が差し替える（stage N → vol N の favicon[N].png、
       stage story.length+1（物語完結）→ 最終 vol の favicon[story.length+1].png）。初期値は vol1 のフォールバック -->
  <link id="app-favicon" rel="icon" href="vol01/favicon1.png" />
  <!-- PWA（インストール可能化）。**3 テンプレ共通**で同じものを置く＝1 行足すときは 3 箇所とも足すこと（同期を見る機械検査は無い）。
       - manifest は全ページで 1 ファイル。favicon のような vol 別・stage 別の切替はしない＝**アプリアイコンは stage 連動しない**
         （WebAPK のアイコンはインストール時に端末へ焼き込まれ OS が持つ。stage は読者ごとに違い manifest は全読者共通なので構造的に不可能）
       - href を相対にするのは base（vite.config.ts）と二重にハードコードしないため。contents/ 配下は 1 階層下で固定なので ../ で足りる
       - apple-touch-icon は Safari 用（manifest の icons を見ないため）。iOS 実機は未検証
       - 仕様の正典は design/requirements/07-ogp.md、入れ方の手順は ops/pwa.md（git 管理外） -->
  <link rel="manifest" href="app.webmanifest" />
  <link rel="apple-touch-icon" href="vol01/favicon1.png" />
  <!-- FOUC 回避（背景色の白フラッシュ対策）：本体 CSS が到着する前の一瞬に真っ白が見えるのを防ぐため、
       body 背景と文字色だけをインラインで先付ける。値は src/styles/toc.css の背景色と一致。
       Vite が注入する本体 CSS の link 要素は pages() プラグインで script より前に移動するが、fetch 完了までの
       極短時間だけ UA デフォルト（白）が見えるのを、この保険で黒に倒す。 -->
  <style>html,body{margin:0;background:#080808;color:#e8e0d0;}</style>
  <!-- 書字方向・端末カテゴリ・物語進行段階（stage）の早期反映（FOUC 回避）：CSS 適用前に <html> 属性を先付け。
       - data-writing-mode: axis.ts/settings.ts と同じ lirmena.writingMode キー。保存値が無ければ既定＝横書き
       - data-device:      matchMedia('(pointer: coarse)') の代理指標で PC/SP を先付け。device.ts が同じロジックで購読・更新
       - data-story-stage: index.ts / main.ts が読了記録後に localStorage 'lirmena.storyStage' へキャッシュした値を先付け。
                           未設定は '1'（stage1・緑）にフォールバック。値は 1〜5 の文字列のみ許容。 -->
  <script>
    try {
      var m = localStorage.getItem('lirmena.writingMode');
      document.documentElement.setAttribute('data-writing-mode', m === 'vertical' ? 'vertical' : 'horizontal');
    } catch (e) {}
    try {
      var d = window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'sp' : 'pc';
      document.documentElement.setAttribute('data-device', d);
    } catch (e) {}
    try {
      var stg = localStorage.getItem('lirmena.storyStage');
      document.documentElement.setAttribute('data-story-stage', stg && /^[1-5]$/.test(stg) ? stg : '1');
    } catch (e) {}
  </script>
  <!-- Google tag (gtag.js)：本番ホストでのみ計測（ローカルの dev/draft/エディタのプレビューと、?dev 付き＝開発モードでは送らない） -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var blockGA = location.hostname !== 'haguchikarasu.github.io'
               || new URLSearchParams(location.search).has('dev');
    // GA を送らなかったことを <html data-dev> に出す（診断バッジの表示条件。CSS だけで拾えるよう属性で置く）。
    // インストール後の PWA はアドレスバーが見えず、スマホでは開発者ツールも使えない＝画面に出す以外に確認手段が無い。
    // 値で理由を分ける：query＝?dev 付き（＝開発モードが効いている）／host＝?dev は無いが本番ホストでもない
    // （localhost・draft・エディタのプレビュー）。**ホスト名で分けてはいけない**：ローカルでは常に host になり、
    // ?dev が効いているかをローカルで確かめられなくなる（確認できるのが本番だけになる）。
    if (blockGA) document.documentElement.setAttribute('data-dev',
      new URLSearchParams(location.search).has('dev') ? 'query' : 'host');
    // ?dev のときは作者用 manifest（dev.webmanifest）を宣言し直す。この 1 行が作者用アプリを入れる唯一の
    // 経路で（?dev 付きの目次を開いてインストールする）、無いと dev アプリ内の全ページが読者用 manifest
    // （id=/lirmena/）を宣言し、Chrome の WebAPK 更新チェックが id の食い違いを見て start_url から ?dev を
    // 落としうる（＝数日後に静かに計測へ戻る）。<link rel="manifest"> はこの script より前にあるので必ず居る。
    // getAttribute で生の相対値を取るので、本文シェル側の ../ もそのまま活きる。
    if (new URLSearchParams(location.search).has('dev')) {
      var mf = document.querySelector('link[rel="manifest"]');
      if (mf) mf.href = mf.getAttribute('href').replace('app.webmanifest', 'dev.webmanifest');
    }
    if (!blockGA) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-D750N4MKZY';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-D750N4MKZY');
    }
  </script>
</head>
<body>
  <!-- ヒーローエリア。body 直下の <header> なので ARIA ランドマーク banner はこれ 1 つだけ
       （vol カード側の <header> は必ず <section> の内側に置く＝index.ts の _buildVolHead 参照） -->
  <header id="idx-hero">
    <figure id="idx-hero-card">
      <!-- 表紙ギャラリー（要件 06-7）の背面レイヤー。遷移中だけ見え、去っていく側の表紙を載せる。
           装飾なので支援技術からは隠す。前面の #idx-hero-img は**常に「いま見えている表紙」**を指し、
           閲覧位置が変わってもレイヤーごと入れ替わらない（キャッシュと e2e の参照先が安定する）。 -->
      <img id="idx-hero-prev" alt="" aria-hidden="true" />
      <img id="idx-hero-img" alt="タイトル" onerror="this.onerror=null;this.src='vol01/vol01.avif'" />
      <!-- ヒーローカードの先付け（ちらつき回避）：applyStoryStage が前回決めた相対パスを localStorage
           'lirmena.heroCard' から読み、パース時点で src を確定させる。**src 属性を HTML に持たせない**のが肝で、
           属性があるとプリロードスキャナが vol1 を先読みし、stage 2 以上の読者には vol1 → vol2 の差し替えが
           必ず見える（2026-09-09 に実際に起きた。preview＝本番ビルドでも再現する）。
           検証規則は src/volumes.ts の HERO_CARD_RE と**同一**＝片方だけ直すと静かに vol01 へ落ちる
           （検査は e2e/toc-hero.spec.ts）。未設定＝初回訪問は stage 1 相当の vol01 にフォールバックする。
           画像が 404 のとき（改名・削除・draft 由来の残留値）は onerror が vol01 へ落とし、そのロードの直後に
           applyStoryStage が story.json を正としてキャッシュを直す＝腐るのは 1 ロードだけ。 -->
      <script>
        try {
          var h = localStorage.getItem('lirmena.heroCard');
          document.getElementById('idx-hero-img').src =
            (h && /^vol\d{2}\/(?!\.\.?$)[^\/\r\n]+$/.test(h)) ? h : 'vol01/vol01.avif';
        } catch (e) {
          document.getElementById('idx-hero-img').src = 'vol01/vol01.avif';
        }
      </script>
      <!-- 表紙ギャラリーのナビ（要件 06-7）。**過去へ進むのが右**。履歴が 1 枚（stage 1）のときと
           端に達したときは index.ts が hidden / disabled にする。
           スマホでは :hover が効かないので普段は見えないが、**DOM からは消さない**——スワイプだけに
           すると、スイッチ操作やキーボードの読者が過去の表紙へ辿り着けなくなる。 -->
      <button type="button" id="idx-hero-newer" class="idx-hero-nav" hidden aria-label="次の巻の表紙を見る">‹</button>
      <button type="button" id="idx-hero-older" class="idx-hero-nav" hidden aria-label="前の巻の表紙を見る">›</button>
      <!-- 位置表示。ドットは装飾（aria-hidden）で、読み上げ用には同じ内容を文言で入れる。 -->
      <p id="idx-hero-dots" aria-live="polite"></p>
    </figure>
    <p id="idx-version-badges">
      <span id="badge-content-version" class="idx-version-badge"></span>
      <span id="badge-site-version" class="idx-version-badge"></span>
      <!-- 開発モードの目印（読者には出ない）。表示条件は <html data-dev>＝GA スクリプトを読み込まなかったとき。
           インストールした PWA はアドレスバーが見えないので、?dev 付きで起動できているかをここで確かめる。
           版数バッジと同じ器に置く＝ヒーロー右下に縦に並ぶ。表示制御は toc.css（TS は関与しない） -->
      <span id="badge-dev" class="idx-version-badge">dev</span>
    </p>
  </header>

  <!-- 続きから読む（オートセーブがある時だけ index.ts が hidden を外す） -->
  <button id="idx-resume" type="button" hidden>続きから読む</button>

  <!-- ep・sec 一覧エリア（本文への導線＝nav。中身は index.ts が動的生成） -->
  <nav id="idx-ep-nav" class="idx-body" aria-label="エピソード一覧">
    <section id="episodes-area">
      <p class="loading-text">読み込み中…</p>
    </section>
  </nav>

  <!-- 付録カード（要件 06-7）。巻カードの続きに置き、見た目も巻カードと同じ部品（.idx-vol-card / .idx-vol-head /
       .idx-ep / .idx-chip）を使う。初期状態は閉じる（open 属性を付けない・開閉は保存しない）。
       - 本文への導線でも保存位置への導線でもないので、エピソード一覧・栞の nav とは別の <aside>
       - 見出しに .idx-vol-k を付けない：e2e/toc-preview.spec.ts が巻の見出しの件数を .idx-vol-k で数えている
         （同じ見た目は toc.css でセレクタを並べて当てる）
       - キャラクター紹介は index.ts の initAppendix が結線する（押された時点の Stage のキャラを出す） -->
  <aside id="idx-appendix-area" class="idx-body" aria-label="付録">
    <details id="idx-appendix" class="idx-vol-card">
      <summary class="idx-vol-head">
        <span class="idx-vol-chev" aria-hidden="true">▶</span>
        <span id="idx-appendix-title">付録</span>
      </summary>
      <section class="idx-vol-body">
        <!-- 設定：作品世界の資料。公開物がまだ無い項目は hidden で置いておき、公開時に hidden を外す
             （別ページ・別リソースへ飛ばすなら <a> に href を足し、ポップアップを開くなら
               #appendix-map のように <button type="button"> へ変える） -->
        <section id="appendix-settings" class="idx-ep">
          <h3 class="idx-ep-title">設定</h3>
          <p class="idx-chips">
            <!-- disabled は initAppendix が characters.json を読み終えて結線した時点で外す
                 （読み込み中に押されて何も起きない、を防ぐ） -->
            <button type="button" id="appendix-chara-btn" class="idx-chip" disabled>キャラクター紹介</button>
            <!-- 地図は押してもページ遷移せずポップアップを開くので <a> ではなく <button>。
                 結線は initAppendixMap（同期・characters.json の取得結果に依存しない）＝disabled は要らない -->
            <button type="button" id="appendix-map" class="idx-chip">エシュカ地図</button>
            <a id="appendix-glossary" class="idx-chip" hidden>用語集</a>
          </p>
        </section>

        <section id="appendix-links" class="idx-ep">
          <h3 class="idx-ep-title">リンク</h3>
          <p class="idx-chips">
            <a class="idx-chip idx-chip--ext" href="https://x.com/haguchikarasu" target="_blank" rel="noopener noreferrer">X</a>
            <a class="idx-chip idx-chip--ext" href="https://kakuyomu.jp/works/822139846666600323" target="_blank" rel="noopener noreferrer">カクヨム</a>
            <a class="idx-chip idx-chip--ext" href="https://ncode.syosetu.com/n8003mj/" target="_blank" rel="noopener noreferrer">小説家になろう</a>
          </p>
        </section>
      </section>
    </details>
  </aside>

  <!-- 栞エリア（保存位置への導線＝nav。中身は index.ts が動的生成） -->
  <nav id="idx-bm-section" class="idx-body" aria-label="栞">
    <p class="idx-sec-label">栞</p>
    <section id="bookmark-slots">
      <!-- index.ts が動的生成 -->
    </section>
  </nav>

  <!-- 更新履歴エリア（index.ts が動的生成）
       版種別スイッチは templates/title.html の #title-screen-changelog-filter と同じ markup の複製
       （同期は e2e/changelog-filter.spec.ts が見る）。ランドマークを増やさないため nav ではなく fieldset。 -->
  <section id="content-changelog" class="idx-body">
    <header id="content-changelog-head">
      <h2 class="idx-sec-label">コンテンツ更新履歴</h2>
      <fieldset id="content-changelog-filter" aria-label="表示する版の種類">
        <button type="button" data-kind="major" aria-pressed="true">メジャー</button>
        <button type="button" data-kind="minor" aria-pressed="true">マイナー</button>
        <button type="button" data-kind="patch" aria-pressed="false">パッチ</button>
      </fieldset>
    </header>
    <ul id="content-changelog-list">
      <!-- index.ts が動的に生成 -->
    </ul>
    <p id="content-changelog-empty" hidden>表示する更新がありません</p>
    <button id="content-changelog-toggle" type="button" hidden>すべて表示</button>
  </section>

  <!-- 右下 FAB メニュー（index.ts が操作） -->
  <nav id="fab-container" aria-label="ページメニュー">
    <ul id="fab-panel" hidden role="menu" aria-label="メニュー">
      <!-- index.ts が動的生成 -->
    </ul>
    <button id="fab-toggle" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
  </nav>

  <!-- 設定ポップアップ（index.ts が操作。templates/reader.html と同じ「空の器＋動的生成」方式）
       aria-modal は付けない：フォーカストラップを実装していないので、付けると「支援技術には背景を隠す
       のに Tab では背景へ出られる」不整合になる。本文シェル側の4ポップアップも同じ理由で付けていない。 -->
  <section id="settings-popup" hidden role="dialog" aria-label="設定">
    <!-- index.ts が動的生成 -->
  </section>

  <!-- 共有ポップアップ（index.ts が操作。aria-modal を付けない理由は上と同じ） -->
  <section id="share-popup" hidden role="dialog" aria-label="共有">
    <!-- index.ts が動的生成 -->
  </section>

  <!-- キャラクター紹介ポップアップ（空の器。中身は characters.ts の init() が生成し、付録カードのボタンで開く。
       本文シェル templates/reader.html にも同じ器がある＝中身の markup は characters.ts 1 か所だけが持つ） -->
  <section id="characters-overlay" hidden role="dialog" aria-label="キャラクター紹介"></section>

  <!-- エシュカ地図ポップアップ（空の器。中身は map.ts の init() が生成し、付録カードのボタンで開く。
       本文シェル templates/reader.html にも同じ器がある＝中身の markup は map.ts 1 か所だけが持つ）。
       role="dialog" は見た目のためでなく、immersive.ts が [role="dialog"] で背景鑑賞モードを抑止するため -->
  <section id="map-overlay" hidden role="dialog" aria-label="エシュカ地図"></section>

  <script type="module" src="src/index.ts"></script>
</body>
</html>
