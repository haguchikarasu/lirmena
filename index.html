<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- OGP・メタ情報
       - theme-color は CSS 変数と2箇所で管理。変更時は両方合わせること
       - og:image は public/ogp.png（1200×630px 推奨）
       - og:description は設定しない
       - 本文・タイトルの各シェル（public/contents/*.html）にも同じ OGP 設定を揃える
  -->
  <meta name="theme-color" content="#080808" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:title" content="輝くもの《リルメナ》" />
  <meta property="og:url" content="https://haguchikarasu.github.io/lirmena/" />
  <meta property="og:image" content="https://haguchikarasu.github.io/lirmena/ogp.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>輝くもの《リルメナ》</title>
  <!-- 目次の favicon は stage に応じて index.ts が差し替える（stage N → vol N の favicon[N].png、
       stage story.length+1（物語完結）→ 最終 vol の favicon[story.length+1].png）。初期値は vol1 のフォールバック -->
  <link id="app-favicon" rel="icon" href="vol01/favicon1.png" />
  <!-- PWA（インストール可能化）。**3 テンプレ共通**で同じものを置く＝1 行足すときは 3 箇所とも足すこと（同期を見る機械検査は無い）。
       - manifest は全ページで 1 ファイル。favicon のような vol 別・stage 別の切替はしない＝**アプリアイコンは stage 連動しない**
         （WebAPK のアイコンはインストール時に端末へ焼き込まれ OS が持つ。stage は読者ごとに違い manifest は全読者共通なので構造的に不可能）
       - href を相対にするのは base（vite.config.ts）と二重にハードコードしないため。contents/ 配下は 1 階層下で固定なので ../ で足りる
       - apple-touch-icon は Safari 用（manifest の icons を見ないため）。iOS 実機は未検証
       - 仕様の正典は design/requirements/07-ogp.md、入れ方の手順は ops/pwa.md（git 管理外） -->
  <link rel="manifest" href="app.webmanifest" />
  <link rel="apple-touch-icon" href="vol01/favicon1.png" />
  <!-- FOUC 回避（背景色の白フラッシュ対策）：本体 CSS が到着する前の一瞬に真っ白が見えるのを防ぐため、
       body 背景と文字色だけをインラインで先付ける。値は src/styles/toc.css の背景色と一致。
       Vite が注入する本体 CSS の link 要素は pages() プラグインで script より前に移動するが、fetch 完了までの
       極短時間だけ UA デフォルト（白）が見えるのを、この保険で黒に倒す。 -->
  <style>html,body{margin:0;background:#080808;color:#e8e0d0;}</style>
  <!-- 書字方向・端末カテゴリ・物語進行段階（stage）の早期反映（FOUC 回避）：CSS 適用前に <html> 属性を先付け。
       - data-writing-mode: axis.ts/settings.ts と同じ lirmena.writingMode キー。保存値が無ければ既定＝横書き
       - data-device:      matchMedia('(pointer: coarse)') の代理指標で PC/SP を先付け。device.ts が同じロジックで購読・更新
       - data-story-stage: index.ts / main.ts が読了記録後に localStorage 'lirmena.storyStage' へキャッシュした値を先付け。
                           未設定は '1'（stage1・緑）にフォールバック。値は 1〜5 の文字列のみ許容。 -->
  <script>
    try {
      var m = localStorage.getItem('lirmena.writingMode');
      document.documentElement.setAttribute('data-writing-mode', m === 'vertical' ? 'vertical' : 'horizontal');
    } catch (e) {}
    try {
      var d = window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? 'sp' : 'pc';
      document.documentElement.setAttribute('data-device', d);
    } catch (e) {}
    try {
      var stg = localStorage.getItem('lirmena.storyStage');
      document.documentElement.setAttribute('data-story-stage', stg && /^[1-5]$/.test(stg) ? stg : '1');
    } catch (e) {}
  </script>
  <!-- Google tag (gtag.js)：本番ホストでのみ計測（ローカルの dev/draft/エディタのプレビューと、?dev 付き＝開発モードでは送らない） -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var blockGA = location.hostname !== 'haguchikarasu.github.io'
               || new URLSearchParams(location.search).has('dev');
    // GA を送らなかったことを <html data-dev> に出す（診断バッジの表示条件。CSS だけで拾えるよう属性で置く）。
    // インストール後の PWA はアドレスバーが見えず、スマホでは開発者ツールも使えない＝画面に出す以外に確認手段が無い。
    // 値で理由を分ける：query＝?dev 付き（＝開発モードが効いている）／host＝?dev は無いが本番ホストでもない
    // （localhost・draft・エディタのプレビュー）。**ホスト名で分けてはいけない**：ローカルでは常に host になり、
    // ?dev が効いているかをローカルで確かめられなくなる（確認できるのが本番だけになる）。
    if (blockGA) document.documentElement.setAttribute('data-dev',
      new URLSearchParams(location.search).has('dev') ? 'query' : 'host');
    // ?dev のときは作者用 manifest（dev.webmanifest）を宣言し直す。この 1 行が作者用アプリを入れる唯一の
    // 経路で（?dev 付きの目次を開いてインストールする）、無いと dev アプリ内の全ページが読者用 manifest
    // （id=/lirmena/）を宣言し、Chrome の WebAPK 更新チェックが id の食い違いを見て start_url から ?dev を
    // 落としうる（＝数日後に静かに計測へ戻る）。<link rel="manifest"> はこの script より前にあるので必ず居る。
    // getAttribute で生の相対値を取るので、本文シェル側の ../ もそのまま活きる。
    if (new URLSearchParams(location.search).has('dev')) {
      var mf = document.querySelector('link[rel="manifest"]');
      if (mf) mf.href = mf.getAttribute('href').replace('app.webmanifest', 'dev.webmanifest');
    }
    if (!blockGA) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-D750N4MKZY';
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', 'G-D750N4MKZY');
    }
  </script>
</head>
<body>
  <!-- ヒーローエリア。body 直下の <header> なので ARIA ランドマーク banner はこれ 1 つだけ
       （vol カード側の <header> は必ず <section> の内側に置く＝index.ts の _buildVolHead 参照） -->
  <header id="idx-hero">
    <figure id="idx-hero-card">
      <img id="idx-hero-img" src="public/vol01/vol01.avif" alt="タイトル" />
    </figure>
    <p id="idx-version-badges">
      <span id="badge-content-version" class="idx-version-badge"></span>
      <span id="badge-site-version" class="idx-version-badge"></span>
      <!-- 開発モードの目印（読者には出ない）。表示条件は <html data-dev>＝GA スクリプトを読み込まなかったとき。
           インストールした PWA はアドレスバーが見えないので、?dev 付きで起動できているかをここで確かめる。
           版数バッジと同じ器に置く＝ヒーロー右下に縦に並ぶ。表示制御は toc.css（TS は関与しない） -->
      <span id="badge-dev" class="idx-version-badge">dev</span>
    </p>
  </header>

  <!-- 続きから読む（オートセーブがある時だけ index.ts が hidden を外す） -->
  <button id="idx-resume" type="button" hidden>続きから読む</button>

  <!-- ep・sec 一覧エリア（本文への導線＝nav。中身は index.ts が動的生成） -->
  <nav class="idx-body" aria-label="エピソード一覧">
    <section id="episodes-area">
      <p class="loading-text">読み込み中…</p>
    </section>
  </nav>

  <!-- 栞エリア（保存位置への導線＝nav。中身は index.ts が動的生成） -->
  <nav id="idx-bm-section" class="idx-body" aria-label="栞">
    <p class="idx-sec-label">栞</p>
    <section id="bookmark-slots">
      <!-- index.ts が動的生成 -->
    </section>
  </nav>

  <!-- 更新履歴エリア（index.ts が動的生成） -->
  <section id="content-changelog" class="idx-body">
    <h2 class="idx-sec-label">コンテンツ更新履歴</h2>
    <ul id="content-changelog-list">
      <!-- index.ts が動的に生成 -->
    </ul>
    <button id="content-changelog-toggle" hidden>すべて表示</button>
  </section>

  <!-- 右下 FAB メニュー（index.ts が操作） -->
  <nav id="fab-container" aria-label="ページメニュー">
    <ul id="fab-panel" hidden role="menu" aria-label="メニュー">
      <!-- index.ts が動的生成 -->
    </ul>
    <button id="fab-toggle" type="button" aria-label="メニューを開く" aria-expanded="false">☰</button>
  </nav>

  <!-- 設定ポップアップ（index.ts が操作。templates/reader.html と同じ「空の器＋動的生成」方式）
       aria-modal は付けない：フォーカストラップを実装していないので、付けると「支援技術には背景を隠す
       のに Tab では背景へ出られる」不整合になる。本文シェル側の4ポップアップも同じ理由で付けていない。 -->
  <section id="settings-popup" hidden role="dialog" aria-label="設定">
    <!-- index.ts が動的生成 -->
  </section>

  <!-- 共有ポップアップ（index.ts が操作。aria-modal を付けない理由は上と同じ） -->
  <section id="share-popup" hidden role="dialog" aria-label="共有">
    <!-- index.ts が動的生成 -->
  </section>

  <script type="module" src="src/index.ts"></script>
</body>
</html>
