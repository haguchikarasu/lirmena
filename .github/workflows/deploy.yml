name: Deploy to GitHub Pages

# サプライチェーン対策（plans/2026-11-09-security-watch.md の 0-3・0-4）：
# - 公開の権限（pages・id-token）は deploy ジョブだけに持たせる。build ジョブは npm ci で
#   依存のコードを動かすので、そこに公開の権限があると、依存に悪性のコードが混ざったとき
#   build ジョブの中から改ざんしたページを公開できてしまう
# - actions はタグではなくコミット SHA で固定する（タグは付け替えられる）。行末の版は人間向けの目印。
#   更新は Dependabot の PR か、手で SHA を差し替える

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # ops/repo-size.md の size-pack 計測に history 全体が必要
          persist-credentials: false  # 以降のステップに GitHub のトークンを残さない（push しないので不要）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dependency-cruiser（依存グラフ検証・ブロッキング）
        run: npm run depcruise
      - name: unit tests（vitest・ブロッキング）
        run: npm test
      - name: ESLint（非ブロッキング・赤アノテーションで気づけるが公開は止めない）
        run: npm run lint
        continue-on-error: true
      - run: npm run build
      - name: repo size（.git の size-pack をジョブサマリに出力・ops/repo-size.md）
        if: always()
        run: |
          echo "### Repository size (git count-objects -vH)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git count-objects -vH >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "size-pack 閾値：500 MiB を超えたら対処検討（GitHub 推奨 1 GB の半分＝早期警戒ライン）" >> "$GITHUB_STEP_SUMMARY"
      # v4 以上にしてある理由：v3.0.1 は中で actions/upload-artifact をタグ（@v4）で呼んでいて、
      # リポジトリ設定の「actions の SHA 固定を必須にする」と両立しない。v4.0.0 は中も SHA で固定している。
      # v4 は隠しファイル（. で始まるもの）を既定で含めない。dist の隠しファイルは空フォルダ用の .gitkeep だけなので困らない
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # Pages へのデプロイ
      id-token: write  # deploy-pages が OIDC で本人確認するため
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
