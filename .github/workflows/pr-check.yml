name: PR check

# PR（主に Dependabot の差し替え PR）を、マージする前に機械の検査に通す（plans/2026-11-09-security-watch.md の 0-6）。
# deploy.yml は main への push でしか走らないので、これが無いと PR はマージするまで検査されない。
# - デプロイはしない。権限は読み取りだけ
# - pull_request は書き込み権限なし・シークレットなしで走るので、外部の人が出した PR でも安全。
#   pull_request_target（権限ありで走る）は使わない
# - workflow_dispatch は、Actions の画面から main で手動実行して動作を確かめるため
# 検査の中身は deploy.yml の build ジョブと揃える（片方だけ直さない）

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: dependency-cruiser（依存グラフ検証・ブロッキング）
        run: npm run depcruise
      - name: unit tests（vitest・ブロッキング）
        run: npm test
      - name: ESLint（非ブロッキング）
        run: npm run lint
        continue-on-error: true
      - name: build（tsc・story-integrity を含む）
        run: npm run build
