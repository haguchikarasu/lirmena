<!-- 共有シート（差し込みの断片＝本文シェル templates/reader.html と目次 index.html の両方へ、ビルド時に
     vite.config.ts の expandIncludes が差し込む。markup の持ち主はこのファイル 1 か所だけ）。
     器はシート（中身の高さだけの fit。PC では右下の小さなカード。src/ui/sheet.ts・src/styles/_sheet.css）。
     結線は src/ui/share.ts（data-share で引く）。 -->
<dialog id="share-popup" class="sheet" data-kind="share" data-detent="fit" aria-labelledby="share-title">
  <span class="sheet-grab" aria-hidden="true"></span>
  <header class="sheet-head">
    <h2 id="share-title" class="sheet-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>共有</h2>
    <button class="sheet-close" type="button" data-sheet-close aria-label="閉じる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <nav class="sheet-body share-list" tabindex="-1" autofocus aria-label="共有の方法">
    <button class="share-btn" type="button" data-share="copy"><span class="share-logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V5.5a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/></svg></span>リンクをコピー</button>
    <button class="share-btn" type="button" data-share="x"><span class="share-logo" aria-hidden="true">𝕏</span>X でシェア</button>
    <button class="share-btn" type="button" data-share="line"><span class="share-logo share-logo--line" aria-hidden="true">LINE</span>LINE でシェア</button>
  </nav>
</dialog>
