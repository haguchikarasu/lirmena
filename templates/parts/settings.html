<!-- 設定シート（差し込みの断片＝本文シェル templates/reader.html と目次 index.html の両方へ、ビルド時に
     vite.config.ts の expandIncludes が差し込む。markup の持ち主はこのファイル 1 か所だけ）。
     器はシート（<dialog class="sheet">。開閉と操作は src/ui/sheet.ts、見た目は src/styles/_sheet.css）。
     結線は src/ui/settings-panel.ts（ラジオの name / value と、ボタンの data-action で引く）。プリセットのカードは
     定義（src/core/settings-model.ts の PRESETS）から settings-panel が .settings-preset の中に組む。
     行の名前と選択肢は文字で書き、選択肢の字はその見た目で描く（明朝は明朝、大は大きく、太字は太く。_sheet.css）。
     ボタンとラベルの文字の前後に空白・改行を入れない（textContent で探すテストと e2e がある）。
     設定の行は <fieldset>＋<legend>、選択肢は <label> で包んだ <input type="radio">（name は Settings のキー）。
     1 行は 1 つのラジオのまとまりなので、Tab で止まるのは行ごとに 1 つ、行の中は矢印キーで選ぶ（ブラウザの動き）。
     <form> では包まない（送信するものが無く、包むと Enter で送信が走る）。.settings-row__opts は枠を描くだけの箱。
     プリセットと消す・戻すの並びは role="group"（名前つきのボタンのまとまり）。 -->
<dialog id="settings-popup" class="sheet" data-kind="settings" data-detent="fit" aria-labelledby="settings-title">
  <span class="sheet-grab" aria-hidden="true"></span>
  <header class="sheet-head">
    <h2 id="settings-title" class="sheet-title"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></svg>設定</h2>
    <button class="sheet-close settings-close" type="button" data-sheet-close aria-label="閉じる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <section class="sheet-body settings-panel" tabindex="-1" autofocus>
    <section class="settings-preset" role="group" aria-label="プリセット"></section>
    <!-- 行の並びは要件 06-4 の設定項目表の順（書字方向→段落の空行→フォント→文字の大きさ→文字の太さ） -->
    <section class="settings-rows">
      <fieldset class="settings-row">
        <legend class="settings-row__label">書字方向</legend>
        <div class="settings-row__opts">
          <label class="settings-opt"><input type="radio" name="writingMode" value="vertical">縦書き</label>
          <label class="settings-opt"><input type="radio" name="writingMode" value="horizontal">横書き</label>
        </div>
      </fieldset>
      <fieldset class="settings-row">
        <legend class="settings-row__label">段落の空行</legend>
        <div class="settings-row__opts">
          <label class="settings-opt"><input type="radio" name="lineGap" value="on">あり</label>
          <label class="settings-opt"><input type="radio" name="lineGap" value="off">なし</label>
        </div>
      </fieldset>
      <fieldset class="settings-row">
        <legend class="settings-row__label">フォント</legend>
        <div class="settings-row__opts">
          <label class="settings-opt settings-opt--serif"><input type="radio" name="fontFamily" value="serif">明朝</label>
          <label class="settings-opt settings-opt--sans"><input type="radio" name="fontFamily" value="sans">ゴシック</label>
        </div>
      </fieldset>
      <fieldset class="settings-row">
        <legend class="settings-row__label">文字の大きさ</legend>
        <div class="settings-row__opts">
          <label class="settings-opt settings-opt--small"><input type="radio" name="fontSize" value="small">小</label>
          <label class="settings-opt"><input type="radio" name="fontSize" value="medium">中</label>
          <label class="settings-opt settings-opt--large"><input type="radio" name="fontSize" value="large">大</label>
        </div>
      </fieldset>
      <fieldset class="settings-row">
        <legend class="settings-row__label">文字の太さ</legend>
        <div class="settings-row__opts">
          <label class="settings-opt"><input type="radio" name="fontWeight" value="normal">通常</label>
          <label class="settings-opt settings-opt--bold"><input type="radio" name="fontWeight" value="bold">太字</label>
        </div>
      </fieldset>
    </section>
    <!-- 記録の消去と初期値に戻す。どれも取り消せないので、settings-panel が確認（ui/confirm）を通してから host を呼ぶ -->
    <section class="settings-data" role="group" aria-label="記録を消す・設定を戻す">
      <button class="settings-action" type="button" data-action="clear-bookmarks">栞をすべて消す</button>
      <button class="settings-action" type="button" data-action="clear-reached">既読を消す</button>
      <button class="settings-action" type="button" data-action="clear-read">読破を消す</button>
      <button class="settings-action" type="button" data-action="reset">設定を初期値に戻す</button>
    </section>
  </section>
</dialog>
