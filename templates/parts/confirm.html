<!-- 確認のポップアップ（差し込みの断片＝本文シェル templates/reader.html と目次 index.html の両方へ、ビルド時に
     vite.config.ts の expandIncludes が差し込む）。消す・初期値に戻す操作の前に src/ui/confirm.ts の
     confirmDialog() が文言と確定ボタンの名前を入れて showModal() で開く。<dialog> なのでシートの上にも重なる
     （最前面の層は後から開いたものが上）。Esc・背景・「やめる」はどれも「やめる」扱い。
     ボタンの文字の前後に空白・改行を入れない（textContent で探すテストと e2e がある）。 -->
<dialog id="confirm-dialog" class="confirm" aria-labelledby="confirm-msg">
  <p id="confirm-msg" class="confirm-msg"></p>
  <p id="confirm-note" class="confirm-note" hidden></p>
  <nav class="confirm-btns">
    <button type="button" data-confirm="0">やめる</button>
    <button type="button" data-confirm="1" class="confirm-ok"></button>
  </nav>
</dialog>
